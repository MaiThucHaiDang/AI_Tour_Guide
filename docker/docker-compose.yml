version: "3.9"

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: ai_tour_guide_db
    environment:
      POSTGRES_DB: ai_tour_guide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai_tour_guide_backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_tour_guide
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
